[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameedgeallocai"
version = "1.0.0"
description = "Reproducible Stackelberg MEC allocation research framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "matplotlib>=3.6", "PyYAML>=6.0"]

[project.optional-dependencies]
rl = ["torch>=2.0"]
test = ["pytest>=7.0"]

[project.scripts]
gameedgealloc = "gameedgealloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
